<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Anniversary Joel! ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 100%;
      max-width: 350px;
    }
    .heart {
      font-size: 50px;
      margin-bottom: 5px;
      display: inline-block;
      animation: beat 1s infinite alternate;
    }
    @keyframes beat {
      to { transform: scale(1.2); }
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 15px;
      color: #ff4b2b;
    }

    .photo-frame {
      width: 100%;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
      color: #eaeaea;
      margin-bottom: 15px;
    }
    .signature {
      font-style: italic;
      color: #ff8a00;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Happy Anniversary, Joel!</h1>

    <div class="photo-frame">
      <img src="https://pin.it/43G30xSCq" alt="Joel and Me">
    </div>

    <p>
      Every day with you feels like a blessing. Thank you for being my rock, my best friend, and my favorite person in the world!
    </p>
    <div class="signature">Forever Yours 💕</div>
  </div>

</body>
</html>
